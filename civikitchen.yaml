$schema: 'https://raw.githubusercontent.com/civico-de/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json'
version: 1
scenario:
  name: handbook
  image: 'ghcr.io/civico-de/civikitchen:v1'
  database:
    image: 'mariadb:11.4'
  extension:
    key: handbook
    path: .
  credentials_output: file
  checks:
    - conform
    - lint
    - format
    - compatibility
    - dependencies
    - javascript
    - test
    - coverage
    - lifecycle
    - smarty
    - taint
policy:
  license: AGPL-3.0-or-later
  npm_license: AGPL-3.0-or-later
  copyright: 'civico GmbH'
  # Media kept in git itself instead of Git LFS.
  lfs_exempt:
    paths:
      - tests/fixtures
    reason: 'Tiny fixtures the path and asset tests read byte for byte'
  # Lowest CiviCRM minor info.xml may declare: the supported ESR.
  civicrm_floor: "6.16"

  # Floor is measured coverage minus one (ckcoverage); ratchet up as coverage
  # grows, never down to make a red build green.
  coverage:
    minimum: 93

  # Hooks arrive as scan-class listeners (Civi\Handbook\ContextHelp).
  hook_style: listener
  renovate_preset: github>civico-de/renovate

  # The scaffold carried 1.0.0 until the first release was cut as 0.1.0;
  # 1.0.0 was never announced or tagged.
  untagged_versions:
    - version: "1.0.0"
      reason: scaffold placeholder, first release cut as 0.1.0

